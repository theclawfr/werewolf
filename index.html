<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werewolf : l'Apocalypse — Ledger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root{
  --paper:#ECE4CE;
  --paper2:#E2D8BC;
  --paper3:#D8CBA8;
  --ink:#211D17;
  --ink-soft:#5B5442;
  --olive:#54502A;
  --olive-dark:#3A3719;
  --blood:#7A2E1E;
  --line:#B8AC85;
  --line-soft:#CFC3A0;
  --ok:#3A5A34;
  --shadow: 0 1px 0 rgba(33,29,23,.08);
  --radius: 2px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0; overflow-x:hidden; max-width:100%;}
body{
  background-color:var(--paper);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.35), transparent 55%),
    radial-gradient(ellipse at 90% 100%, rgba(0,0,0,.06), transparent 60%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.13  0 0 0 0 0.11  0 0 0 0 0.09  0 0 0 0.05 0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  color:var(--ink);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.disp{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.02em; font-weight:700; margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:inherit; color:var(--ink);}
a{color:var(--olive-dark);}

/* ---- App chrome ---- */
#app{max-width:1180px; margin:0 auto; padding:0 0 90px;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:16px 20px; border-bottom:3px solid var(--ink);
  background:linear-gradient(180deg, rgba(255,255,255,.25), transparent);
  flex-wrap:wrap;
}
.wordmark{display:flex; flex-direction:column; line-height:1;}
.wordmark .w1{font-size:26px; letter-spacing:.03em;}
.wordmark .w2{font-size:12px; font-weight:500; color:var(--blood); letter-spacing:.18em; margin-top:2px; font-family:'Oswald',sans-serif;}
.topbar-right{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-soft);}
.pill{
  border:1.5px solid var(--ink); border-radius:20px; padding:4px 12px;
  background:var(--paper2); font-weight:600; letter-spacing:.03em;
}
.savebadge{font-size:11.5px; color:var(--ink-soft); min-width:64px; text-align:right;}
.savebadge.saving{color:var(--blood);}
.linkbtn{background:none;border:none;color:var(--olive-dark);text-decoration:underline;font-size:12.5px;padding:0;}

/* ---- Landing ---- */
.landing{max-width:640px; margin:60px auto; padding:0 20px;}
.landing h1{font-size:44px; text-align:center;}
.landing .sub{text-align:center; color:var(--ink-soft); margin-top:6px; margin-bottom:36px; font-size:14px;}
.rolecards{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.rolecard{
  border:2px solid var(--ink); border-radius:var(--radius); padding:22px 18px; background:var(--paper2);
  cursor:pointer; text-align:left; transition:transform .12s ease, box-shadow .12s ease;
}
.rolecard:hover{transform:translateY(-2px); box-shadow:3px 4px 0 var(--ink);}
.rolecard h3{font-size:19px; margin-bottom:6px;}
.rolecard p{margin:0; font-size:13px; color:var(--ink-soft);}
.landing-panel{border:2px solid var(--ink); background:var(--paper2); padding:22px; margin-top:20px; border-radius:var(--radius);}
.landing-panel h3{font-size:16px; margin-bottom:14px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; border:1.5px solid var(--ink); background:var(--paper); padding:8px 10px; border-radius:var(--radius);
}
.field textarea{resize:vertical; min-height:64px;}
.row{display:flex; gap:12px;}
.row > *{flex:1;}
.btn{
  border:2px solid var(--ink); background:var(--ink); color:var(--paper); padding:9px 18px;
  border-radius:var(--radius); font-weight:600; font-size:13.5px; letter-spacing:.02em;
}
.btn:hover{background:var(--olive-dark);}
.btn.secondary{background:var(--paper); color:var(--ink);}
.btn.secondary:hover{background:var(--paper3);}
.btn.small{padding:5px 10px; font-size:12px;}
.btn.danger{background:var(--blood); border-color:var(--blood); color:var(--paper);}
.err{color:var(--blood); font-size:12.5px; margin-top:8px;}
.codebox{
  font-family:'Oswald',sans-serif; font-size:28px; letter-spacing:.12em; text-align:center;
  border:2px dashed var(--ink); padding:14px; margin:14px 0; background:var(--paper);
}

/* ---- Layout: sidebar + main ---- */
.layout{display:flex; align-items:flex-start;}
.sidebar{
  width:200px; flex-shrink:0; padding:18px 10px; position:sticky; top:0;
  border-right:2px solid var(--ink); min-height:calc(100vh - 90px);
}
.navbtn{
  display:block; width:100%; text-align:left; background:none; border:none; padding:9px 12px;
  font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; letter-spacing:.02em;
  color:var(--ink-soft); border-radius:var(--radius); margin-bottom:2px;
}
.navbtn:hover{background:var(--paper2);}
.navbtn.active{background:var(--ink); color:var(--paper);}
.main{flex:1; padding:22px 26px; min-width:0; max-width:100%; overflow-x:hidden;}

.sectionhead{
  background:var(--ink); color:var(--paper); padding:8px 14px; font-size:15px;
  display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; border-radius:var(--radius);
}
.card{border:1.5px solid var(--line); background:rgba(255,255,255,.28); padding:16px; border-radius:var(--radius); margin-bottom:18px;}
.card h4{font-size:12.5px; color:var(--olive); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; border-bottom:1px solid var(--line); padding-bottom:6px;}

.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
.traitrow{display:flex; align-items:center; justify-content:space-between; padding:4px 0; gap:8px;}
.traitname{font-size:13.5px; font-weight:500;}
.dots{display:flex; gap:4px; flex-shrink:0;}
.dot{
  width:15px; height:15px; border-radius:50%; border:1.6px solid var(--ink); background:transparent;
  padding:0; display:inline-block;
}
.dot.on{background:var(--ink);}
.dot.renown.on{background:var(--olive); border-color:var(--olive);}

.boxes{display:flex; gap:3px; flex-wrap:wrap;}
.box{
  width:19px; height:19px; border:1.6px solid var(--ink); background:var(--paper);
  font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0; line-height:1;
  color:var(--blood); font-family:'Oswald',sans-serif;
}
.gaugeblock{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:6px;}
.gaugelabel{width:130px; font-family:'Oswald',sans-serif; font-weight:600; font-size:14px;}
.gaugemax{font-size:11.5px; color:var(--ink-soft);}

.tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.tab{border:1.5px solid var(--ink); background:var(--paper2); padding:6px 13px; border-radius:20px; font-size:12.5px; font-weight:600;}
.tab.active{background:var(--ink); color:var(--paper);}

table.reftable{width:100%; min-width:640px; border-collapse:collapse; font-size:13px;}
table.reftable th{text-align:left; font-family:'Oswald',sans-serif; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--olive); border-bottom:2px solid var(--ink); padding:6px 8px;}
table.reftable td{padding:7px 8px; border-bottom:1px solid var(--line-soft); vertical-align:top;}
table.reftable tr:hover td{background:rgba(255,255,255,.4);}

.itemlist .item{border:1.5px solid var(--line); background:rgba(255,255,255,.3); padding:10px 12px; border-radius:var(--radius); margin-bottom:8px;}
.item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.item-name{font-family:'Oswald',sans-serif; font-weight:600; font-size:14.5px;}
.item-meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.item-effect{font-size:13px; margin-top:6px; color:var(--ink);}
.iconbtn{border:1.5px solid var(--ink); background:var(--paper); width:24px; height:24px; border-radius:50%; font-size:14px; line-height:1; padding:0;}
.iconbtn.remove{color:var(--blood); border-color:var(--blood);}

.searchbar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.searchbar input[type=text]{flex:1; min-width:180px; border:1.5px solid var(--ink); padding:7px 10px; border-radius:var(--radius); background:var(--paper);}
.searchbar select{border:1.5px solid var(--ink); padding:7px 10px; border-radius:var(--radius); background:var(--paper);}
.chip{display:inline-block; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; border:1px solid var(--olive); color:var(--olive); padding:1px 7px; border-radius:10px; margin-left:6px;}
.chip.alias{border-color:var(--ink-soft); color:var(--ink-soft);}

.formcard{border:1.5px solid var(--ink); padding:12px 14px; margin-bottom:10px; border-radius:var(--radius); background:rgba(255,255,255,.3);}
.formcard h4{font-family:'Oswald',sans-serif; font-size:16px; margin:0 0 6px; color:var(--ink);}
.formcard ul{margin:0; padding-left:18px; font-size:13px;}
.formcard li{margin-bottom:2px;}

.notegrid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.xprow{display:flex; gap:20px;}

.tablegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
.charcard{border:2px solid var(--ink); background:var(--paper2); padding:14px; border-radius:var(--radius); cursor:pointer;}
.charcard:hover{box-shadow:3px 4px 0 var(--ink); transform:translateY(-2px);}
.charcard h4{font-family:'Oswald',sans-serif; font-size:16px; margin-bottom:2px;}
.charcard .sub{font-size:12px; color:var(--ink-soft); margin-bottom:8px;}
.miniGauges{display:flex; gap:10px; font-size:11px; color:var(--ink-soft);}

.empty{text-align:center; color:var(--ink-soft); padding:30px 10px; font-size:13.5px;}
.helptext{font-size:12px; color:var(--ink-soft); margin-top:4px;}

@media (max-width: 860px){
  .layout{flex-direction:column;}
  .sidebar{
    width:100%; position:fixed; top:auto; bottom:0; left:0; right:0; border-right:none; border-top:2px solid var(--ink);
    background:var(--paper); display:flex; align-items:center; overflow-x:auto; padding:6px 6px; min-height:auto; height:auto; z-index:20;
  }
  .navbtn{white-space:nowrap; width:auto; flex-shrink:0; margin-bottom:0; margin-right:4px; font-size:12px; padding:8px 10px;}
  .main{padding:16px 14px;}
  .grid3{grid-template-columns:1fr;}
  .notegrid{grid-template-columns:1fr;}
  .rolecards{grid-template-columns:1fr;}
  #app{padding-bottom:70px;}
}
</style>
</head>

/* ============ Helpers ============ */
function genCode(len=6){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function debounce(fn, wait){
  let t = null;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), wait); };
}
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function ensureTrackLength(arr, len){
  while (arr.length < len) arr.push(0);
  if (arr.length > len) arr.length = len;
  return arr;
}

/* ============ Persistence ============ */
const saveCharacterDebounced = debounce(async function(){
  if (!fbReady || !state.myCode || !state.character) { renderSaveBadge('local'); return; }
  state.saving = true; renderSaveBadge('saving');
  try {
    await db.collection(CHAR_COL).doc(state.myCode).set({
      data: state.character,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    state.saving = false; renderSaveBadge('ok');
  } catch(e){
    console.error(e); state.saving = false; renderSaveBadge('err');
  }
}, 700);

function renderSaveBadge(status){
  const b = document.getElementById('savebadge');
  if (!b) return;
  b.classList.remove('saving');
  if (status === 'saving'){ b.textContent = 'Enregistrement…'; b.classList.add('saving'); }
  else if (status === 'ok'){ b.textContent = 'Enregistré'; }
  else if (status === 'local'){ b.textContent = 'Local (Firebase non configuré)'; }
  else if (status === 'err'){ b.textContent = 'Erreur de sauvegarde'; }
}

function listenToCharacter(code){
  if (state.unsubChar) state.unsubChar();
  if (!fbReady) return;
  state.unsubChar = db.collection(CHAR_COL).doc(code).onSnapshot(doc => {
    if (!doc.exists) return;
    const snap = doc.data();
    if (doc.metadata.hasPendingWrites) return; // our own echo
    state.character = Object.assign(newCharacter(), snap.data);
    renderApp();
  });
}

async function createCharacter(){
  state.myCode = genCode();
  state.character = newCharacter();
  state.role = 'joueur';
  state.view = 'sheet';
  state.section = 'identite';
  renderApp();
  if (fbReady){
    try {
      await db.collection(CHAR_COL).doc(state.myCode).set({ data: state.character, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      listenToCharacter(state.myCode);
    } catch(e){ console.error(e); }
  }
}

async function loadCharacterByCode(code){
  code = code.trim().toUpperCase();
  if (!code) return;
  state.loadError = '';
  if (!fbReady){
    state.loadError = "Firebase n'est pas configuré dans ce fichier — impossible de charger un code existant.";
    renderApp(); return;
  }
  try {
    const doc = await db.collection(CHAR_COL).doc(code).get();
    if (!doc.exists){ state.loadError = "Aucun personnage trouvé avec ce code."; renderApp(); return; }
    state.myCode = code;
    state.character = Object.assign(newCharacter(), doc.data().data);
    state.role = 'joueur';
    state.view = 'sheet';
    state.section = 'identite';
    listenToCharacter(code);
    renderApp();
  } catch(e){ console.error(e); state.loadError = "Erreur de connexion à Firebase."; renderApp(); }
}

/* ---- Table (MJ) ---- */
async function openTable(code){
  code = code.trim().toUpperCase();
  if (!code) return;
  state.loadError = '';
  if (!fbReady){ state.loadError = "Firebase n'est pas configuré dans ce fichier."; renderApp(); return; }
  state.tableCode = code;
  state.role = 'mj';
  state.view = 'table';
  try {
    const doc = await db.collection(TABLE_COL).doc(code).get();
    if (!doc.exists){
      await db.collection(TABLE_COL).doc(code).set({ memberCodes: [], updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
    listenToTable(code);
  } catch(e){ console.error(e); state.loadError = "Erreur de connexion à Firebase."; }
  renderApp();
}

function listenToTable(code){
  if (state.unsubTable) state.unsubTable();
  state.unsubTable = db.collection(TABLE_COL).doc(code).onSnapshot(doc => {
    if (!doc.exists) return;
    const members = doc.data().memberCodes || [];
    members.forEach(mc => {
      db.collection(CHAR_COL).doc(mc).onSnapshot(cdoc => {
        if (cdoc.exists) state.tableMembers[mc] = cdoc.data().data;
        else state.tableMembers[mc] = null;
        renderApp();
      });
    });
    Object.keys(state.tableMembers).forEach(mc => { if (!members.includes(mc)) delete state.tableMembers[mc]; });
    renderApp();
  });
}

async function addMemberToTable(code){
  code = code.trim().toUpperCase();
  if (!code || !fbReady) return;
  await db.collection(TABLE_COL).doc(state.tableCode).update({
    memberCodes: firebase.firestore.FieldValue.arrayUnion(code)
  });
}
async function removeMemberFromTable(code){
  if (!fbReady) return;
  await db.collection(TABLE_COL).doc(state.tableCode).update({
    memberCodes: firebase.firestore.FieldValue.arrayRemove(code)
  });
}

function openMemberSheet(code){
  state.myCode = code;
  state.character = state.tableMembers[code] ? Object.assign(newCharacter(), state.tableMembers[code]) : newCharacter();
  state.view = 'sheet';
  state.section = 'identite';
  state.fromTable = true;
  listenToCharacter(code);
  renderApp();
}

    <div class="row">

function dotsHtml(current, max, path, extraClass=''){
  let h = `<span class="dots">`;
  for (let i=1;i<=max;i++){
    h += `<button class="dot ${extraClass} ${i<=current?'on':''}" data-action="set-dot" data-path="${path}" data-val="${i}"></button>`;
  }
  h += `</span>`;
  return h;
}

  return `
  ${sectionHead('Attributs', '9 traits · 1 à 5')}

    ${Object.entries(ATTRIBUTS).map(([cat, list]) => `
      <div class="card"><h4>${cat}</h4>
        ${list.map(a => `<div class="traitrow"><span class="traitname">${a}</span>${dotsHtml(c.attributs[a]||0,5,'attributs.'+a)}</div>`).join('')}
      </div>`).join('')}

}

function boxesHtml(arr, max, path){
  ensureTrackLength(arr, max);
  let h = `<div class="boxes">`;
  for (let i=0;i<max;i++){
    const v = arr[i]||0;
    const mark = v===1 ? '/' : (v===2 ? '&times;' : '');
    h += `<button class="box" data-action="cycle-box" data-path="${path}" data-idx="${i}">${mark}</button>`;
  }
  h += `</div>`;
  return h;
}

    <div class="gaugeblock"><span class="gaugelabel">Volonté</span>${boxesHtml(c.volonteDegats, wMax, 'volonteDegats')}<span class="gaugemax">max ${wMax} (Sang-froid+Résolution)</span></div>
    <div class="gaugeblock"><span class="gaugelabel">Bonus Crinos</span>${boxesHtml(c.crinosDegats, 4, 'crinosDegats')}<span class="gaugemax">+4 niveaux de santé sous forme crinos</span></div>

/* ---- Dons & Rites ---- */
function giftLabel(g){
  return `${g.nom}${g.aliasDe ? ` <span class="chip alias">= ${g.aliasDe}</span>` : ''}`;
}

function renderDonsCatalogRows(){
  const f = state.giftFilter;
  const q = f.q.trim().toLowerCase();
  return GIFTS.filter(g => (f.cat==='Tous' || g.categorie===f.cat) && (!q || g.nom.toLowerCase().includes(q)))
    .slice(0, 80)
    .map((g, idx) => {
      const realIdx = GIFTS.indexOf(g);
      const effet = g.aliasDe ? `Identique au don « ${g.aliasDe} » d'une autre liste.` : g.effet;
      return `<tr>
        <td>${giftLabel(g)}${g.effetIncomplet?' <span class="chip alias">à vérifier</span>':''}</td>
        <td>${g.categorie}</td>
        <td>${g.renomTotal ?? '—'}</td>
        <td>${g.aliasDe ? '—' : (g.groupement||'—')}</td>
        <td>${g.aliasDe ? '—' : (g.cout||'—')}</td>
        <td style="max-width:280px;">${escapeHtml(effet||'')}</td>
        <td><button class="iconbtn" data-action="add-don" data-idx="${realIdx}">+</button></td>
      </tr>`;
    }).join('');
}

function renderRitesCatalogRows(){
  const q = state.riteFilter.q.trim().toLowerCase();
  return RITES.filter(r => !q || r.nom.toLowerCase().includes(q)).map((r) => {
    const realIdx = RITES.indexOf(r);
    return `<tr>
      <td>${r.nom}</td><td>${r.groupement}</td>
      <td style="max-width:320px;">${escapeHtml(r.effet)}</td>
      <td><button class="iconbtn" data-action="add-rite" data-idx="${realIdx}">+</button></td>
    </tr>`;
  }).join('');
}

  return `
  ${sectionHead('Dons connus', c.dons.length+' don(s)')}
  <div class="itemlist">

    ${c.dons.map((g,i) => `

      </select>
      <input type="text" id="gift-search" placeholder="Rechercher un don..." value="${escapeHtml(state.giftFilter.q)}">

    <div style="max-height:420px; max-width:100%; overflow:auto;">
      <table class="reftable">

  ${sectionHead('Base des Rites', RITES.length+' entrées')}

  return `
  ${sectionHead('Formes du Garou')}
  ${FORMES.map(f => `
    <div class="formcard">
      <h4>${f.nom} <span style="font-size:12px; font-weight:400; color:var(--ink-soft);">— Coût : ${f.cout}</span></h4>

  <p class="helptext">${FORMES_NOTE}</p>`;

  ${sectionHead('Notes libres')}

    <textarea data-field="notes" rows="16" style="width:100%; border:1.5px solid var(--ink); padding:10px; border-radius:2px; background:var(--paper);">${escapeHtml(c.notes)}</textarea>

}

/* ---- Table (MJ) view ---- */
function renderTableView(){
  const codes = Object.keys(state.tableMembers);
  return `
  ${renderTopbar()}
  <div class="main" style="padding:22px 26px;">
    ${sectionHead('Table', state.tableCode)}
    <div class="card">
      <div class="row">
        <input type="text" id="add-member-code" placeholder="Code du personnage à ajouter" style="text-transform:uppercase;">
        <button class="btn small" data-action="add-member" style="flex:0 0 auto;">Ajouter à la table</button>
      </div>
    </div>
    <div class="tablegrid">
      ${codes.length===0 ? '<div class="empty">Aucun personnage sur cette table pour l\'instant.</div>' : ''}
      ${codes.map(code => {
        const m = state.tableMembers[code];
        if (!m) return `<div class="charcard"><h4>${code}</h4><div class="sub">Personnage introuvable</div>
          <button class="iconbtn remove" data-action="remove-member" data-code="${code}">&times;</button></div>`;
        const sMax = santeMax(m), wMax = volonteMax(m);
        const sDmg = (m.santeDegats||[]).filter(v=>v>0).length;
        const wDmg = (m.volonteDegats||[]).filter(v=>v>0).length;
        return `<div class="charcard" data-action="open-member" data-code="${code}">
          <h4>${escapeHtml(m.nom||'(sans nom)')}</h4>
          <div class="sub">${escapeHtml(m.auspice||'?')} · ${escapeHtml(m.tribu||'?')} — ${code}</div>
          <div class="miniGauges">
            <span>Santé ${sMax-sDmg}/${sMax}</span>
            <span>Volonté ${wMax-wDmg}/${wMax}</span>
            <span>Rage ${m.rage||0}/5</span>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

/* ============ Event handling ============ */
function updateCharField(path, value){
  const c = state.character;
  const parts = path.split('.');
  let obj = c;
  for (let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
  obj[parts[parts.length-1]] = value;
  saveCharacterDebounced();
}

function attachLandingPanelHandlers(){
  const panel = document.getElementById('landing-panel');
  if (!panel) return;
  panel.querySelectorAll('[data-action="new-character"]').forEach(b=>b.onclick=createCharacter);
  panel.querySelectorAll('[data-action="load-character"]').forEach(b=>b.onclick=()=>{
    loadCharacterByCode(document.getElementById('load-code-input').value);
  });
  panel.querySelectorAll('[data-action="open-table"]').forEach(b=>b.onclick=()=>{
    openTable(document.getElementById('table-code-input').value);
  });
  const loadInp = document.getElementById('load-code-input');
  if (loadInp) loadInp.addEventListener('keydown', e => { if (e.key==='Enter') loadCharacterByCode(loadInp.value); });
  const tableInp = document.getElementById('table-code-input');
  if (tableInp) tableInp.addEventListener('keydown', e => { if (e.key==='Enter') openTable(tableInp.value); });
}

function attachHandlers(){
  attachLandingPanelHandlers();
  const root = document.getElementById('app');

  // Landing role pick
  root.querySelectorAll('[data-action="pick-joueur"]').forEach(b=>b.onclick=()=>{
    state.landingPanel = 'joueur'; state.loadError='';
    renderApp();
  });
  root.querySelectorAll('[data-action="pick-mj"]').forEach(b=>b.onclick=()=>{
    state.landingPanel = 'mj'; state.loadError='';
    renderApp();
  });
  root.querySelectorAll('[data-action="go-home"]').forEach(b=>b.onclick=()=>{
    if (state.unsubChar) state.unsubChar();
    if (state.unsubTable) state.unsubTable();
    Object.assign(state, { role:null, view:'landing', myCode:null, character:null, tableCode:null, tableMembers:{}, fromTable:false, landingPanel:null, loadError:'' });
    renderApp();
  });
  root.querySelectorAll('[data-action="back-to-table"]').forEach(b=>b.onclick=()=>{
    if (state.unsubChar) state.unsubChar();
    state.view = 'table'; state.fromTable = false;
    renderApp();
  });

  // Sidebar nav
  root.querySelectorAll('[data-action="nav"]').forEach(b=>b.onclick=()=>{
    state.section = b.dataset.section; renderApp();
  });

  // Text/select/textarea fields bound via data-field
  root.querySelectorAll('[data-field]').forEach(inp=>{
    const ev = (inp.tagName==='SELECT' || inp.type==='number') ? 'change' : 'input';
    inp.addEventListener(ev, () => {
      let v = inp.value;
      if (inp.type==='number') v = Number(v)||0;
      updateCharField(inp.dataset.field, v);
    });
  });

  // Dots
  root.querySelectorAll('[data-action="set-dot"]').forEach(b=>b.onclick=()=>{
    const path = b.dataset.path; const val = Number(b.dataset.val);
    const parts = path.split('.');
    let obj = state.character;
    for (let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
    const key = parts[parts.length-1];
    const current = obj[key]||0;
    obj[key] = (current===val) ? val-1 : val; // click same dot to reduce by one
    saveCharacterDebounced();
    renderApp();
  });

  // Boxes (health/willpower tri-state)
  root.querySelectorAll('[data-action="cycle-box"]').forEach(b=>b.onclick=()=>{
    const path = b.dataset.path; const idx = Number(b.dataset.idx);
    const arr = state.character[path];
    arr[idx] = ((arr[idx]||0)+1) % 3;
    saveCharacterDebounced();
    renderApp();
  });

  // Avantages
  const avSel = document.getElementById('avantage-select');
  root.querySelectorAll('[data-action="add-avantage-list"]').forEach(b=>b.onclick=()=>{
    if (!avSel || avSel.value==='') return;
    const options = [...ATOUTS.map(a=>({...a, kind:'Atout'})), ...HISTORIQUES.map(a=>({...a, kind:'Historique'}))];
    const o = options[Number(avSel.value)];
    state.character.avantages.push({ nom:o.nom, type:o.kind, valeur:1, note:'', effetRef:o.effet });
    saveCharacterDebounced(); renderApp();
  });
  root.querySelectorAll('[data-action="add-avantage-custom"]').forEach(b=>b.onclick=()=>{
    const nomInp = document.getElementById('avantage-custom-nom');
    const valInp = document.getElementById('avantage-custom-val');
    if (!nomInp.value.trim()) return;
    state.character.avantages.push({ nom:nomInp.value.trim(), type:'Personnalisé', valeur:Number(valInp.value)||0, note:'' });
    saveCharacterDebounced(); renderApp();
  });
  root.querySelectorAll('[data-action="remove-avantage"]').forEach(b=>b.onclick=()=>{
    state.character.avantages.splice(Number(b.dataset.idx),1); saveCharacterDebounced(); renderApp();
  });
  root.querySelectorAll('[data-action="edit-avantage-val"]').forEach(inp=>inp.addEventListener('change',()=>{
    state.character.avantages[Number(inp.dataset.idx)].valeur = Number(inp.value)||0; saveCharacterDebounced();
  }));
  root.querySelectorAll('[data-action="edit-avantage-note"]').forEach(inp=>inp.addEventListener('input',()=>{
    state.character.avantages[Number(inp.dataset.idx)].note = inp.value; saveCharacterDebounced();
  }));

  // Dons/Rites catalog filters
  const catSel = document.getElementById('gift-cat-filter');
  if (catSel) catSel.onchange = () => { state.giftFilter.cat = catSel.value; document.getElementById('gift-rows').innerHTML = renderDonsCatalogRows(); attachCatalogRowHandlers(); };
  const giftSearch = document.getElementById('gift-search');
  if (giftSearch) giftSearch.oninput = () => { state.giftFilter.q = giftSearch.value; document.getElementById('gift-rows').innerHTML = renderDonsCatalogRows(); attachCatalogRowHandlers(); };
  const riteSearch = document.getElementById('rite-search');
  if (riteSearch) riteSearch.oninput = () => { state.riteFilter.q = riteSearch.value; document.getElementById('rite-rows').innerHTML = renderRitesCatalogRows(); attachCatalogRowHandlers(); };
  attachCatalogRowHandlers();

  // Table view
  root.querySelectorAll('[data-action="add-member"]').forEach(b=>b.onclick=()=>{
    const inp = document.getElementById('add-member-code');
    if (inp.value.trim()) addMemberToTable(inp.value);
    inp.value='';
  });
  root.querySelectorAll('[data-action="remove-member"]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation(); removeMemberFromTable(b.dataset.code);
  });
  root.querySelectorAll('[data-action="open-member"]').forEach(b=>b.onclick=()=>{
    openMemberSheet(b.dataset.code);
  });
}

function attachCatalogRowHandlers(){
  document.querySelectorAll('[data-action="add-don"]').forEach(b=>b.onclick=()=>{
    const g = GIFTS[Number(b.dataset.idx)];
    state.character.dons.push({ nom:g.nom, categorie:g.categorie, renomTotal:g.renomTotal, cout:g.cout, action:g.action, groupement:g.groupement, duree:g.duree, effet:g.effet });
    saveCharacterDebounced(); renderApp();
  });
  document.querySelectorAll('[data-action="add-rite"]').forEach(b=>b.onclick=()=>{
    const r = RITES[Number(b.dataset.idx)];
    state.character.rites.push({ nom:r.nom, groupement:r.groupement, effet:r.effet });
    saveCharacterDebounced(); renderApp();
  });
}

document.addEventListener('click', function(e){
  const t = e.target.closest('[data-action="remove-don"]');
  if (t){ state.character.dons.splice(Number(t.dataset.idx),1); saveCharacterDebounced(); renderApp(); }
  const t2 = e.target.closest('[data-action="remove-rite"]');
  if (t2){ state.character.rites.splice(Number(t2.dataset.idx),1); saveCharacterDebounced(); renderApp(); }
});

renderApp();

</script>
